name: tltr
version: 1.0.0
description: Bespoke cross-platform 38-key keyboard layout (Colemak Mod-DH Wide Angle) with Kanata and QMK implementations
author: DivitMittal
license: MIT
target:
  - claude
  - codex
  - opencode
type: instructions

dependencies:
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/oraios/serena
        - serena
        - start-mcp-server
        - --context
        - claude-code
        - --project
        - ~/Projects/hid/TLTR
    # Konnect (KiCad 10 MCP) for hardware/: schematic, PCB, ERC/DRC tools.
    # Not in the MCP registry yet; `konnect` must be on PATH (install through
    # KiCad's Plugin and Content Manager). See hardware/README.md.
    - name: konnect
      registry: false
      transport: stdio
      command: konnect
      args: []
